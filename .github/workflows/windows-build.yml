name: Plague's Voice Studio Windows package
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
    # Documentation, README screenshots and audio-showcase copy don't change
    # the Windows app. Avoid 20+ minute rebuilds for those commits.
    # Code changes on main/develop/release branches automatically build; tags build release packages.
    paths:
      - 'src/**'
      - 'plugins/promotional-writer/**'
      - 'plugins/writer_core/**'
      - 'scripts/**'
      - 'models/**'
      - 'assets/plagues-voice-studio-*'
      - 'assets/version_info.txt'
      - 'launcher.py'
      - 'optional_engine_runner.py'
      - 'ChatterboxStudio.spec'
      - 'installer.iss'
      - 'pyproject.toml'
      - 'requirements-release.txt'
      - 'tests/**'
      - 'OPTIONAL_ENGINES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/windows-build.yml'
concurrency:
  group: pvs-windows-${{ github.ref }}
  # A newer push must not destroy a nearly completed Windows installer build.
  # GitHub may replace a pending (not running) build; the running job continues.
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify source and release tag identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_release_version.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/check_release_version.py
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build slim model-on-demand portable and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Slim
      - name: Verify isolated install, reinstall, startup and data preservation
        shell: pwsh
        run: ./scripts/test_installer.ps1 -SourceDirectory 'dist\PlaguesVoiceStudio030Experimental'
      # Reject multi-disk output. Users should never see an Insert Disk prompt.
      - name: Verify standalone installer
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem artifacts -Filter 'PlaguesVoiceStudio-Setup-*.exe' -File)
          $slices = @(Get-ChildItem artifacts -Filter '*.bin' -File)
          if ($setups.Count -ne 1 -or $slices.Count -ne 0) {
            throw "Expected one standalone setup EXE with no BIN slices; got $($setups.Count) EXE(s), $($slices.Count) BIN(s)."
          }
          if ($setups[0].Length -ge 4000000000) {
            throw "Standalone installer is too large to ship as a single EXE."
          }
          Write-Host "Verified single-file installer: $($setups[0].Name) ($($setups[0].Length) bytes)."
      - name: Produce SHA-256 checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in @('.zip', '.exe') })
          if ($packages.Count -lt 2) { throw 'Expected both portable ZIP and standalone installer before checksums.' }
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path artifacts) 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
          Get-Content artifacts/SHA256SUMS.txt
      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Portable
          path: artifacts/PlaguesVoiceStudio-Slim-Portable.zip
          if-no-files-found: error
      - name: Upload complete Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Standalone-Installer
          path: artifacts/PlaguesVoiceStudio-Setup-*.exe
          if-no-files-found: error

  # Install on a fresh Windows runner, not just compile on the build machine.
  installer_smoke:
    name: Fresh Windows installer smoke test
    runs-on: windows-2022
    needs: windows
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Standalone-Installer
          path: installer-payload
      - name: Install standalone EXE silently and verify target files
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem installer-payload -Filter 'PlaguesVoiceStudio-Setup-*.exe' -File)
          $bins = @(Get-ChildItem installer-payload -Filter '*.bin' -File)
          if ($exes.Count -ne 1 -or $bins.Count -ne 0) {
            throw 'Expected one standalone setup EXE with no external disk slices.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'PVS-Single-File-Install'
          $logFile = Join-Path $env:RUNNER_TEMP 'pvs-setup-smoke.log'
          $args = @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target", "/LOG=$logFile")
          $proc = Start-Process -FilePath $exes[0].FullName -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(20 * 60 * 1000)) {
            $proc.Kill()
            throw 'Silent installer timed out; do not publish this installer.'
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $logFile) { Get-Content $logFile -Tail 60 }
            throw "Silent installer failed with exit code $($proc.ExitCode)."
          }
          $app = Join-Path $target 'PlaguesVoiceStudio030Experimental.exe'
          if (-not (Test-Path $app)) {
            throw "Install succeeded but application is missing at $app."
          }
          Write-Host "Standalone installation verified: $app"
      - name: Verify installed runtime, GUI and repeated startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'PVS-Single-File-Install'
          $app = Join-Path $target 'PlaguesVoiceStudio030Experimental.exe'
          foreach ($mode in @('--self-test','--ui-self-test','--ui-self-test')) {
            $report = Join-Path $env:RUNNER_TEMP ('installed-' + [guid]::NewGuid().ToString('N') + '.json')
            $process = Start-Process -FilePath $app -ArgumentList @($mode, ('"' + $report + '"')) -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Installed application test timed out.' }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Installed application test failed.' }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if ($result.status -ne 'passed') { throw ($result.errors -join "`n") }
          }

  publish_release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, installer_smoke]
    permissions:
      contents: write
    steps:
      - name: Download tested portable build
        uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Portable
          path: release-payload/portable
      - name: Download tested standalone installer
        uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Standalone-Installer
          path: release-payload/installer
      - name: Download SHA-256 manifest
        uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Windows-Checksums
          path: release-payload/checksums
      - name: Verify GitHub Release asset size limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          limit = 2 * 1024**3
          paths = [*Path('release-payload/portable').glob('*.zip'),
                   *Path('release-payload/installer').glob('*.exe')]
          if len(paths) != 2:
              raise SystemExit('Release is missing the portable ZIP or Windows setup EXE')
          oversized = [p for p in paths if p.stat().st_size >= limit]
          if oversized:
              for p in oversized:
                  print(f'GitHub Releases 2 GiB asset limit exceeded: {p.name} ({p.stat().st_size:,} bytes)')
              raise SystemExit('Cannot publish this as a GitHub Release: build a smaller model-on-demand installer or host the full offline installer elsewhere. DO NOT publish a release that has no usable installer.')
          PY
      - name: Publish official release only after installer tests pass
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            release-payload/portable/*.zip
            release-payload/installer/*.exe
            release-payload/checksums/SHA256SUMS.txt
