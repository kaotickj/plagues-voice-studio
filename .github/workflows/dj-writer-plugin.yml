name: DJ Writer Windows installer and portable

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'release/**']
    paths:
      - 'plugins/dj-writer/**'
      - 'plugins/writer_core/**'
      - 'src/plagued_ai/**'
      - 'BINARY_LICENSE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSES/**'
      - '.github/workflows/dj-writer-plugin.yml'
  pull_request:
    paths:
      - 'plugins/dj-writer/**'
      - 'plugins/writer_core/**'
      - 'src/plagued_ai/**'
      - 'BINARY_LICENSE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSES/**'
      - '.github/workflows/dj-writer-plugin.yml'

permissions:
  contents: read

concurrency:
  group: dj-writer-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Test and build standalone DJ Writer, installer and portable
        shell: pwsh
        run: ./plugins/dj-writer/build_windows.ps1
      - name: Verify isolated installer, repeated startup and retained libraries
        shell: pwsh
        run: ./plugins/dj-writer/test_installer.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Writer-Windows-Installer
          path: plugins/dj-writer/artifacts/DJ-Writer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Writer-Windows-Portable
          path: plugins/dj-writer/artifacts/DJ-Writer-*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Writer-Windows-Checksums
          path: plugins/dj-writer/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
