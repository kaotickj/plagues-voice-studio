name: Plague's Voice Studio Linux package

# Linux release builds run locally under the user's build policy. Retain this
# historical acceptance workflow for explicitly authorized manual recovery only;
# source pushes and pull requests must not schedule Linux runners or artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pvs-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux audio and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libegl1 libgl1 libopengl0 libpulse0 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libxcb-image0
      - name: Test and build native Linux portable
        run: bash scripts/build_linux.sh
      - name: Build Debian amd64 installer from the tested application
        run: .venv-linux-build/bin/python scripts/package_linux_deb.py --app dist/linux/PlaguesVoiceStudio030Experimental --output artifacts/linux-installer
      - name: Upload portable and checksums
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-x86_64-Portable
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Debian installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-amd64-Installer
          path: artifacts/linux-installer/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-Build-Diagnostics
          path: |
            build/linux/diagnostics/*.json
            build/linux/*/warn-*.txt
          if-no-files-found: warn

  extracted_startup:
    name: Fresh Linux extraction and GUI startup
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install system dependencies without Python build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libegl1 libgl1 libopengl0 libpulse0 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libxcb-image0 xvfb xauth
      - uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-x86_64-Portable
          path: payload
      - name: Verify checksums, extract to path with spaces and launch twice
        shell: bash
        run: |
          cd payload
          sha256sum -c SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/Linux portable test"
          tar -xzf PlaguesVoiceStudio-*-Linux-x86_64-Portable.tar.gz -C "$RUNNER_TEMP/Linux portable test"
          app="$RUNNER_TEMP/Linux portable test/PlaguesVoiceStudio030Experimental"
          mkdir -p "$RUNNER_TEMP/linux-reports"
          export PLAGUED_AI_HOME="$RUNNER_TEMP/linux-profile"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/linux-config"
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          timeout 180 "$app/start-voice-studio.sh" --self-test "$RUNNER_TEMP/linux-reports/runtime.json"
          for iteration in 1 2; do
            QT_QPA_PLATFORM=xcb timeout 180 xvfb-run -a "$app/start-voice-studio.sh" --ui-self-test "$RUNNER_TEMP/linux-reports/gui-$iteration.json"
          done
          cat "$RUNNER_TEMP/linux-reports/"*.json
      - name: Retain extracted startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-Startup-Diagnostics
          path: ${{ runner.temp }}/linux-reports/*.json
          if-no-files-found: warn

  debian_installer:
    name: Debian 13 install, reinstall and removal
    needs: build
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install acceptance-test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils
      - uses: actions/download-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-amd64-Installer
          path: payload
      - name: Install with dependencies and verify desktop entry
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          sha256sum -c SHA256SUMS.txt
          apt-get install -y --no-install-recommends ./plagues-voice-studio_*_amd64.deb
          desktop-file-validate /usr/share/applications/plagues-voice-studio.desktop
          test "$(dpkg-query -W -f='${Architecture}' plagues-voice-studio)" = amd64
      - name: Verify installed startup, reinstall and user-data preservation
        shell: bash
        run: |
          set -euo pipefail
          export PLAGUED_AI_HOME="$RUNNER_TEMP/installer-profile"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/installer-config"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          mkdir -p "$PLAGUED_AI_HOME/apps/voice-studio" "$PLAGUED_AI_HOME/models" "$RUNNER_TEMP/installer-reports"
          printf 'keep-existing-model\n' > "$PLAGUED_AI_HOME/models/acceptance-marker"
          printf 'keep-existing-settings\n' > "$PLAGUED_AI_HOME/apps/voice-studio/acceptance-marker"
          sha256sum "$PLAGUED_AI_HOME/models/acceptance-marker" "$PLAGUED_AI_HOME/apps/voice-studio/acceptance-marker" > "$RUNNER_TEMP/preserved-files.sha256"
          timeout 180 plagues-voice-studio --self-test "$RUNNER_TEMP/installer-reports/runtime.json"
          for iteration in 1 2; do
            QT_QPA_PLATFORM=xcb timeout 180 xvfb-run -a plagues-voice-studio --ui-self-test "$RUNNER_TEMP/installer-reports/gui-$iteration.json"
          done
          apt-get install -y --reinstall --no-install-recommends ./payload/plagues-voice-studio_*_amd64.deb
          timeout 180 plagues-voice-studio --self-test "$RUNNER_TEMP/installer-reports/reinstalled.json"
          sha256sum -c "$RUNNER_TEMP/preserved-files.sha256"
          apt-get remove -y plagues-voice-studio
          test ! -e /usr/bin/plagues-voice-studio
          sha256sum -c "$RUNNER_TEMP/preserved-files.sha256"
      - name: Retain installer acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlaguesVoiceStudio-Linux-Installer-Diagnostics
          path: ${{ runner.temp }}/installer-reports/*.json
          if-no-files-found: warn
