name: Bethesda export regression tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/bethesda-tests.yml'

permissions:
  contents: read

jobs:
  bethesda:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install headless Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install export test dependencies
        run: python -m pip install "pytest>=8,<10" "imageio-ffmpeg>=0.5,<1" "PyQt6>=6.7,<7"
      - name: Test resampling, packaging, installation and GUI handoffs
        run: >-
          python -m pytest -q
          tests/test_bethesda_export.py tests/test_bethesda_validation.py
          tests/test_bethesda_widget.py tests/test_v020_features.py
          tests/test_optional_engines.py
